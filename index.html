<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout Maxence" />
  <title>Workout Maxence</title>
  <style>
    :root{
      --bg:#0b0b0d; --panel:#151519; --panel2:#1d1d23; --line:#2c2c34;
      --text:#f7f7f8; --muted:#9d9da7; --accent:#ff6b35; --accent2:#ff9b73;
      --ok:#37d67a; --danger:#ff5a5f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{
      min-height:100vh;
      padding:env(safe-area-inset-top) 14px calc(190px + env(safe-area-inset-bottom));
      overscroll-behavior:none;
    }
    .wrap{max-width:680px;margin:0 auto}
    .topbar{
      position:sticky;top:0;z-index:20;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      margin:0 -14px;padding:10px 14px 12px;
      background:rgba(11,11,13,.96);backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.06)
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .app-icon{
      width:44px;height:44px;border-radius:13px;background:var(--accent);
      display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;
      flex:0 0 auto;box-shadow:0 8px 18px rgba(255,107,53,.22)
    }
    .brand-title{font-size:16px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .pct{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
    .progress-line{height:6px;background:#25252c;border-radius:99px;overflow:hidden;margin:12px 0 16px}
    .progress{height:100%;background:var(--accent);width:0;transition:.25s}

    .focus-card{
      background:linear-gradient(180deg,#19191e,#121216);
      border:1px solid var(--line);border-radius:24px;padding:18px;
      box-shadow:0 18px 40px rgba(0,0,0,.24)
    }
    .eyebrow{font-size:11px;font-weight:850;letter-spacing:.7px;color:var(--accent2);text-transform:uppercase}
    .exercise{font-size:27px;line-height:1.08;font-weight:900;margin:7px 0 6px}
    .meta{font-size:13px;color:var(--muted)}
    .set-focus{
      margin-top:18px;padding:18px;border-radius:20px;background:#202027;border:1px solid #32323a;
      text-align:center
    }
    .set-label{font-size:13px;color:var(--muted);font-weight:700}
    .set-number{font-size:42px;font-weight:950;line-height:1;margin:6px 0}
    .reps{font-size:18px;font-weight:800}
    .weight-label{font-size:12px;color:var(--muted);margin:18px 0 7px;text-align:left}
    .weight-input{
      width:100%;background:#0e0e12;color:var(--text);border:1px solid var(--line);
      border-radius:14px;padding:14px 15px;font-size:21px;font-weight:800;outline:none
    }
    .weight-input:focus{border-color:var(--accent)}
    .complete-btn{
      width:100%;margin-top:12px;padding:15px;border:0;border-radius:15px;
      background:var(--accent);color:white;font-size:16px;font-weight:900
    }
    .secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    button{
      border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:14px;
      background:var(--panel2);color:var(--text)
    }
    button.ghost{background:transparent;border:1px solid var(--line)}
    button:active{transform:scale(.985)}
    .tip-btn{
      width:100%;margin-top:12px;display:flex;align-items:center;justify-content:space-between;
      background:#1c1c22;border:1px solid var(--line)
    }

    .up-next{
      margin-top:12px;padding:14px 15px;border:1px solid var(--line);border-radius:17px;background:#121216
    }
    .up-next small{color:var(--muted);display:block;margin-bottom:4px}
    .up-next strong{font-size:15px}

    .timer-dock{
      position:fixed;left:0;right:0;bottom:0;z-index:30;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      background:rgba(12,12,14,.97);backdrop-filter:blur(18px);
      border-top:1px solid var(--line)
    }
    .timer-inner{max-width:680px;margin:auto}
    .timer-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .timer-copy small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
    .timer-value{font-size:40px;font-weight:950;letter-spacing:.5px;line-height:1}
    .timer-state{font-size:12px;color:var(--muted);margin-top:4px}
    .timer-main{
      min-width:126px;padding:14px 18px;background:var(--accent);color:white;font-size:15px
    }
    .timer-bar{height:5px;background:#24242b;border-radius:99px;overflow:hidden;margin:10px 0}
    .timer-bar > div{height:100%;width:0;background:var(--accent);transition:width 1s linear}
    .timer-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .timer-controls button{padding:10px 6px;font-size:12px}

    .sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}
    .sheet-backdrop.open{display:block}
    .bottom-sheet{
      position:absolute;left:0;right:0;bottom:0;background:#18181d;border-radius:25px 25px 0 0;
      padding:10px 17px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)
    }
    .handle{width:46px;height:5px;border-radius:99px;background:#4a4a52;margin:2px auto 14px}
    .sheet-title{font-size:20px;font-weight:900;margin-bottom:9px}
    .sheet-text{font-size:15px;line-height:1.5;color:#dddddf}
    .sheet-close{width:100%;margin-top:16px;background:var(--accent);color:white}

    .done-card{text-align:center;padding:30px 20px}
    .done-card h2{font-size:30px;margin:0 0 10px}
    .done-card p{color:var(--muted);line-height:1.45}
    .done-card button{background:var(--accent);color:white;margin-top:8px}

    @media(max-width:420px){
      .exercise{font-size:24px}
      .timer-value{font-size:36px}
      .timer-main{min-width:112px}
      .timer-controls{gap:5px}
      .timer-controls button{font-size:11px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="app-icon">MC</div>
      <div>
        <div class="brand-title">Maxence</div>
        <div class="brand-sub">Pecs · Dos · Bras</div>
      </div>
    </div>
    <div class="pct">
      <div id="pctText">0 %</div>
      <div id="countText">0 / 38 séries</div>
    </div>
  </div>

  <div class="progress-line"><div class="progress" id="progress"></div></div>

  <div id="workoutView">
    <div class="focus-card">
      <div class="eyebrow" id="groupLabel"></div>
      <div class="exercise" id="exerciseName"></div>
      <div class="meta" id="exerciseMeta"></div>

      <div class="set-focus">
        <div class="set-label" id="setLabel"></div>
        <div class="set-number" id="setNumber"></div>
        <div class="reps" id="repsLabel"></div>

        <div class="weight-label">Charge / réglage de cette série</div>
        <input id="weightInput" class="weight-input" type="text" inputmode="decimal" placeholder="Ex. 80 kg" />

        <button class="complete-btn" onclick="completeCurrentSet()">✓ Série terminée</button>

        <div class="secondary-row">
          <button class="ghost" onclick="previousSet()">← Série préc.</button>
          <button class="ghost" onclick="nextSetManual()">Série suiv. →</button>
        </div>

        <button class="tip-btn" onclick="openTipSheet()">
          <span>Consigne / astuce</span><span>↑</span>
        </button>
      </div>

      <div class="up-next">
        <small>Ensuite</small>
        <strong id="nextLabel"></strong>
      </div>
    </div>
  </div>

  <div id="doneView" style="display:none" class="focus-card done-card">
    <h2>Séance terminée</h2>
    <p>Les charges restent mémorisées sur ce téléphone pour la prochaine séance.</p>
    <button onclick="resetWorkout()">Recommencer</button>
  </div>
</div>

<div class="sheet-backdrop" id="tipSheet" onclick="closeTipSheet(event)">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="sheet-title" id="tipTitle"></div>
    <div class="sheet-text" id="tipText"></div>
    <button class="sheet-close" onclick="closeTipSheet()">Fermer</button>
  </div>
</div>

<div class="timer-dock">
  <div class="timer-inner">
    <div class="timer-top">
      <div class="timer-copy">
        <small>Chrono de repos</small>
        <div class="timer-value" id="timerValue">00:00</div>
        <div class="timer-state" id="timerState">Prêt</div>
      </div>
      <button class="timer-main" id="timerMain" onclick="toggleTimer()">Démarrer</button>
    </div>
    <div class="timer-bar"><div id="timerProgress"></div></div>
    <div class="timer-controls">
      <button class="ghost" onclick="adjustTimer(-15)">−15 s</button>
      <button class="ghost" onclick="adjustTimer(15)">+15 s</button>
      <button class="ghost" onclick="loadPlannedRest()">Repos prévu</button>
      <button class="ghost" onclick="resetTimer()">Zéro</button>
      <button class="ghost" onclick="skipRest()">Passer</button>
    </div>
  </div>
</div>

<script>
const exercises = [
  {group:"PECS", name:"Développé couché barre", sets:4, reps:"5–7", rest:165, cue:"Monte progressivement en charge. Garde 1–2 répétitions en réserve. Omoplates serrées, trajectoire stable. Évite l’échec sur les premières séries."},
  {group:"PECS", name:"Développé incliné haltères", sets:4, reps:"8–10", rest:120, cue:"Inclinaison modérée. Amplitude contrôlée. Cherche le haut des pecs sans transformer le mouvement en développé épaules."},
  {group:"PECS", name:"Chest press convergente", sets:3, reps:"10–12", rest:90, cue:"Tension continue et négative contrôlée. La dernière série peut finir à 0–1 répétition en réserve."},
  {group:"PECS", name:"Butterfly / Pec deck", sets:3, reps:"12–15", rest:75, cue:"Épaules basses, poitrine sortie. Cherche surtout la fermeture des bras et la contraction des pecs. Inutile de charger très lourd."},
  {group:"DOS", name:"Tractions ou tirage vertical", sets:4, reps:"6–8", rest:120, cue:"Un seul vrai tirage vertical dans la séance. Pense à tirer les coudes vers les hanches plutôt que les mains vers la poitrine."},
  {group:"DOS", name:"Rowing barre", sets:4, reps:"6–8", rest:150, cue:"Mouvement lourd mais propre. Tronc gainé, pas de balancier excessif. Cherche l’épaisseur du dos."},
  {group:"DOS", name:"Tirage haut Hammer", sets:4, reps:"8–12", rest:105, cue:"Poitrine stable. Tire les coudes vers le bas et l’arrière. Charge solide, amplitude complète et retour contrôlé."},
  {group:"DOS", name:"Rowing machine poitrine appuyée", sets:3, reps:"10–12", rest:90, cue:"Poitrine collée au support. Tire avec les coudes et marque une courte contraction en fin de mouvement."},
  {group:"SUPERSET", name:"Chest press + machine dos", sets:3, reps:"12–15 + 12–15", rest:75, cue:"Enchaîne les deux mouvements sans repos, puis prends 75 secondes. Ici, priorité au pump et à la congestion."},
  {group:"BRAS", name:"Curl barre EZ + triceps corde", sets:3, reps:"8–12 + 10–15", rest:60, cue:"Superset. Curl barre EZ avec les coudes stables, puis triceps corde. Repos seulement après les deux mouvements."},
  {group:"BRAS", name:"Curl marteau + extension triceps au-dessus de la tête", sets:3, reps:"10–12 + 10–15", rest:60, cue:"Dernier bloc. Tu peux pousser la dernière série proche de l’échec si la technique reste propre."}
];

const totalSets = exercises.reduce((n,e)=>n+e.sets,0);
const blankDone = () => exercises.map(e=>Array(e.sets).fill(false));
const blankWeights = () => exercises.map(e=>Array(e.sets).fill(""));

let state = JSON.parse(localStorage.getItem("maxenceWorkoutV3") || "null") || {
  ex:0, set:0, done:blankDone(), weights:blankWeights()
};

if(!Array.isArray(state.done) || state.done.length!==exercises.length) state.done=blankDone();
if(!Array.isArray(state.weights) || state.weights.length!==exercises.length) state.weights=blankWeights();

for(let i=0;i<exercises.length;i++){
  state.done[i] = Array.from({length:exercises[i].sets},(_,j)=>!!(state.done[i]&&state.done[i][j]));
  state.weights[i] = Array.from({length:exercises[i].sets},(_,j)=>(state.weights[i]&&state.weights[i][j])||"");
}

let timerRemaining = 0;
let timerTotal = 0;
let timerInterval = null;
let wakeLock = null;

function save(){ localStorage.setItem("maxenceWorkoutV3", JSON.stringify(state)); }

function fmt(sec){
  sec=Math.max(0,Math.round(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function plannedRest(){ return exercises[state.ex]?.rest || 60; }

function updateTimerUI(){
  document.getElementById("timerValue").textContent=fmt(timerRemaining);
  const pct = timerTotal>0 ? Math.max(0,Math.min(100,((timerTotal-timerRemaining)/timerTotal)*100)) : 0;
  document.getElementById("timerProgress").style.width=pct+"%";
  if(timerInterval){
    document.getElementById("timerMain").textContent="Pause";
    document.getElementById("timerState").textContent="Repos en cours";
  }else if(timerRemaining>0){
    document.getElementById("timerMain").textContent="Reprendre";
    document.getElementById("timerState").textContent="En pause";
  }else{
    document.getElementById("timerMain").textContent="Démarrer";
    document.getElementById("timerState").textContent="Prêt";
  }
}

function startTimer(seconds){
  clearInterval(timerInterval);
  timerRemaining=seconds;
  timerTotal=seconds;
  updateTimerUI();
  timerInterval=setInterval(()=>{
    timerRemaining--;
    if(timerRemaining<=0){
      timerRemaining=0;
      clearInterval(timerInterval);
      timerInterval=null;
      beep();
    }
    updateTimerUI();
  },1000);
  updateTimerUI();
}

function toggleTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval=null;
  }else{
    if(timerRemaining<=0){
      timerRemaining=plannedRest();
      timerTotal=timerRemaining;
    }
    startTimer(timerRemaining);
  }
  updateTimerUI();
}
function adjustTimer(delta){
  timerRemaining=Math.max(0,timerRemaining+delta);
  timerTotal=Math.max(timerTotal,timerRemaining);
  updateTimerUI();
}
function loadPlannedRest(){
  clearInterval(timerInterval);timerInterval=null;
  timerRemaining=plannedRest();timerTotal=timerRemaining;updateTimerUI();
}
function resetTimer(){
  clearInterval(timerInterval);timerInterval=null;
  timerRemaining=0;timerTotal=0;updateTimerUI();
}
function skipRest(){
  resetTimer();
}

function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;gain.gain.value=.08;osc.start();
    setTimeout(()=>{osc.stop();ctx.close();},350);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,100,180]);
}

function countDone(){ return state.done.flat().filter(Boolean).length; }

function render(){
  const done=countDone();
  const pct=Math.round((done/totalSets)*100);
  document.getElementById("progress").style.width=pct+"%";
  document.getElementById("pctText").textContent=pct+" %";
  document.getElementById("countText").textContent=`${done} / ${totalSets} séries`;

  if(state.ex>=exercises.length){
    document.getElementById("workoutView").style.display="none";
    document.getElementById("doneView").style.display="block";
    return;
  }
  document.getElementById("workoutView").style.display="block";
  document.getElementById("doneView").style.display="none";

  const e=exercises[state.ex];
  document.getElementById("groupLabel").textContent=e.group;
  document.getElementById("exerciseName").textContent=e.name;
  document.getElementById("exerciseMeta").textContent=`${e.sets} séries • ${e.reps} reps • repos prévu ${fmt(e.rest)}`;
  document.getElementById("setLabel").textContent=`Série ${state.set+1} sur ${e.sets}`;
  document.getElementById("setNumber").textContent=state.set+1;
  document.getElementById("repsLabel").textContent=`${e.reps} reps`;

  const input=document.getElementById("weightInput");
  input.value=state.weights[state.ex][state.set]||"";
  input.oninput=(ev)=>{
    state.weights[state.ex][state.set]=ev.target.value;
    save();
  };

  const next=getNextPosition(state.ex,state.set);
  if(next.ex>=exercises.length){
    document.getElementById("nextLabel").textContent="Fin de séance";
  }else{
    const ne=exercises[next.ex];
    document.getElementById("nextLabel").textContent=
      next.ex===state.ex ? `Série ${next.set+1} · ${ne.name}` : `${ne.name} · série 1`;
  }
}

function getNextPosition(ex,set){
  if(set+1<exercises[ex].sets) return {ex,set:set+1};
  return {ex:ex+1,set:0};
}
function getPrevPosition(ex,set){
  if(set>0) return {ex,set:set-1};
  if(ex>0) return {ex:ex-1,set:exercises[ex-1].sets-1};
  return {ex:0,set:0};
}

function completeCurrentSet(){
  if(state.ex>=exercises.length) return;
  state.done[state.ex][state.set]=true;
  const rest=plannedRest();
  const next=getNextPosition(state.ex,state.set);
  state.ex=next.ex;state.set=next.set;
  save();
  startTimer(rest);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function previousSet(){
  const p=getPrevPosition(state.ex,state.set);
  state.ex=p.ex;state.set=p.set;save();render();
}
function nextSetManual(){
  const n=getNextPosition(state.ex,state.set);
  state.ex=n.ex;state.set=n.set;save();render();
}

function openTipSheet(){
  if(state.ex>=exercises.length) return;
  const e=exercises[state.ex];
  document.getElementById("tipTitle").textContent="Consigne · "+e.name;
  document.getElementById("tipText").textContent=e.cue;
  document.getElementById("tipSheet").classList.add("open");
}
function closeTipSheet(evt){
  if(evt && evt.target!==document.getElementById("tipSheet")) return;
  document.getElementById("tipSheet").classList.remove("open");
}

function resetWorkout(){
  state={ex:0,set:0,done:blankDone(),weights:state.weights||blankWeights()};
  resetTimer();save();render();window.scrollTo({top:0,behavior:"smooth"});
}

async function enableWakeLock(){
  try{
    if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen");
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") enableWakeLock();
});

enableWakeLock();
render();
updateTimerUI();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
