<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Séance Pecs Dos" />
  <title>Séance Pecs + Dos + Bras</title>
  <style>
    :root{
      --bg:#0d0d0f; --card:#17171b; --card2:#202027; --text:#f6f6f7;
      --muted:#a7a7b0; --accent:#ff6b35; --accent2:#ff9b73; --line:#2b2b33;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      min-height:100vh;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom));
    }
    .wrap{max-width:680px;margin:0 auto}
    header{padding:14px 2px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:5}
    h1{font-size:24px;line-height:1.05;margin:6px 0 4px}
    .sub{color:var(--muted);font-size:13px}
    .progress-wrap{margin-top:12px}
    .progress-line{height:8px;background:#26262d;border-radius:99px;overflow:hidden}
    .progress{height:100%;width:0;background:var(--accent);transition:.25s}
    .progress-text{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
    .timer{
      margin:12px 0 14px;padding:14px;border:1px solid var(--line);border-radius:18px;
      background:linear-gradient(180deg,#1d1d22,#151519);display:flex;align-items:center;justify-content:space-between;gap:12px
    }
    .timer strong{font-size:34px;letter-spacing:.5px}
    .timer small{display:block;color:var(--muted);margin-bottom:2px}
    .timer-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button{
      border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;
      background:var(--card2);color:var(--text)
    }
    button.primary{background:var(--accent);color:white}
    button.ghost{border:1px solid var(--line);background:transparent}
    .card{
      border:1px solid var(--line);background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;
      box-shadow:0 10px 25px rgba(0,0,0,.18)
    }
    .card.current{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,107,53,.15),0 16px 35px rgba(0,0,0,.25)}
    .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent2);margin-bottom:7px}
    .ex-title{font-size:22px;font-weight:800;margin:0 0 4px}
    .meta{color:var(--muted);font-size:14px;margin-bottom:12px}
    .sets{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
    .set-block{border:1px solid var(--line);background:#202027;border-radius:14px;padding:10px}
    .set-block.done{background:#173a27;border-color:#265c3d}
    .set-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .set-check{
      flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:#292931;
      color:var(--text);font-weight:800
    }
    .set-block.done .set-check{background:#205034;border-color:#35724e;color:#caffda}
    .set-reps{font-size:12px;color:var(--muted);white-space:nowrap}
    .weight-input{
      width:100%;background:#101014;color:var(--text);border:1px solid var(--line);
      border-radius:10px;padding:10px;font-size:16px
    }
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .tip-btn{
      width:100%;margin-top:10px;background:#24242b;border:1px solid var(--line);
      text-align:left;display:flex;justify-content:space-between;align-items:center
    }
    .summary{margin:14px 0 6px;color:var(--muted);font-size:13px}
    .nav{display:flex;gap:10px;margin-top:12px}
    .nav button{flex:1}
    .footerbar{
      position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      background:rgba(13,13,15,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10
    }
    .footerbar .inner{max-width:680px;margin:auto;display:flex;gap:10px}
    .footerbar button{flex:1}
    .done-all{text-align:center;padding:28px 16px}
    .done-all h2{font-size:28px;margin-bottom:8px}
    .sheet-backdrop{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:30
    }
    .sheet-backdrop.open{display:block}
    .bottom-sheet{
      position:absolute;left:0;right:0;bottom:0;background:#18181d;border-radius:24px 24px 0 0;
      border-top:1px solid var(--line);padding:10px 16px calc(18px + env(safe-area-inset-bottom));
      max-height:72vh;overflow:auto
    }
    .sheet-handle{width:48px;height:5px;background:#4a4a52;border-radius:99px;margin:2px auto 14px}
    .sheet-title{font-size:20px;font-weight:800;margin-bottom:10px}
    .sheet-text{color:#dddde3;line-height:1.5;font-size:15px}
    .sheet-close{width:100%;margin-top:16px}
    @media(max-width:420px){
      .timer{align-items:flex-start}
      .timer-actions{max-width:170px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">Séance du soir</div>
    <h1>Pecs + Dos + Bras</h1>
    <div class="sub">Objectif hypertrophie • 4 jours de repos derrière</div>
    <div class="progress-wrap">
      <div class="progress-line"><div class="progress" id="progress"></div></div>
      <div class="progress-text"><span id="progressText"></span><span id="setProgress"></span></div>
    </div>
  </header>

  <div class="timer">
    <div>
      <small>Repos</small>
      <strong id="timer">00:00</strong>
    </div>
    <div class="timer-actions">
      <button class="primary" onclick="toggleTimer()" id="timerBtn">Démarrer</button>
      <button class="ghost" onclick="resetTimer()">À zéro</button>
    </div>
  </div>

  <div id="exerciseCard"></div>
  <div class="summary" id="summary"></div>

  <div id="allDone" style="display:none" class="card done-all">
    <h2>Séance terminée</h2>
    <p>Les charges saisies restent mémorisées sur ce téléphone.</p>
    <button class="primary" onclick="resetSession()">Recommencer la séance</button>
  </div>
</div>

<div class="sheet-backdrop" id="tipSheet" onclick="closeTipSheet(event)">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="tipSheetTitle">Consigne</div>
    <div class="sheet-text" id="tipSheetText"></div>
    <button class="primary sheet-close" onclick="closeTipSheet()">Fermer</button>
  </div>
</div>

<div class="footerbar">
  <div class="inner">
    <button class="ghost" onclick="prevExercise()">← Précédent</button>
    <button class="primary" onclick="nextExercise()">Suivant →</button>
  </div>
</div>

<script>
const exercises = [
  {
    group:"PECS", name:"Développé couché barre", sets:4, reps:"5–7", rest:165,
    cue:"Monte progressivement en charge. Garde 1–2 reps en réserve. Omoplates serrées, trajectoire stable. Pas d’échec sur les premières séries."
  },
  {
    group:"PECS", name:"Développé incliné haltères", sets:4, reps:"8–10", rest:120,
    cue:"Inclinaison modérée. Amplitude contrôlée. Cherche le haut des pecs sans transformer le mouvement en développé épaules."
  },
  {
    group:"PECS", name:"Chest press convergente", sets:3, reps:"10–12", rest:90,
    cue:"Tension continue et négative contrôlée. La dernière série peut finir à 0–1 répétition en réserve."
  },
  {
    group:"PECS", name:"Butterfly / Pec deck", sets:3, reps:"12–15", rest:75,
    cue:"Épaules basses, poitrine sortie. Cherche surtout la fermeture des bras et la contraction des pecs. Inutile de charger très lourd."
  },
  {
    group:"DOS", name:"Tractions ou tirage vertical", sets:4, reps:"6–8", rest:120,
    cue:"Un seul vrai tirage vertical dans la séance. Pense à tirer les coudes vers les hanches plutôt que les mains vers la poitrine."
  },
  {
    group:"DOS", name:"Rowing barre", sets:4, reps:"6–8", rest:150,
    cue:"Mouvement lourd mais propre. Tronc gainé, pas de balancier excessif. Cherche l’épaisseur du dos."
  },
  {
    group:"DOS", name:"Tirage haut Hammer", sets:4, reps:"8–12", rest:105,
    cue:"Poitrine stable. Tire les coudes vers le bas et l’arrière. Charge solide, amplitude complète et retour contrôlé. Ce mouvement remplace le deuxième tirage vertical."
  },
  {
    group:"DOS", name:"Rowing machine poitrine appuyée", sets:3, reps:"10–12", rest:90,
    cue:"Poitrine collée au support. Tire avec les coudes et marque une courte contraction en fin de mouvement."
  },
  {
    group:"SUPERSET", name:"Chest press + machine dos", sets:3, reps:"12–15 + 12–15", rest:75,
    cue:"Enchaîne les deux mouvements sans repos, puis prends 75 secondes. Ici, priorité au pump et à la congestion, pas à la charge maximale."
  },
  {
    group:"BRAS", name:"Curl barre EZ + triceps corde", sets:3, reps:"8–12 + 10–15", rest:60,
    cue:"Superset. Curl barre EZ avec les coudes stables, puis triceps corde. Exécution propre et amplitude complète. Repos seulement après les deux mouvements."
  },
  {
    group:"BRAS", name:"Curl marteau + extension triceps au-dessus de la tête", sets:3, reps:"10–12 + 10–15", rest:60,
    cue:"Dernier bloc. Tu peux pousser la dernière série proche de l’échec si la technique reste propre."
  }
];

const blankDone = () => exercises.map(e => Array(e.sets).fill(false));
const blankWeights = () => Object.fromEntries(exercises.map((e,i)=>[i,Array(e.sets).fill("")]));

let state = JSON.parse(localStorage.getItem("seancePecsDosStateV2") || "null") || {
  current:0, done:blankDone(), weights:blankWeights()
};

if(!state.done || state.done.length !== exercises.length) state.done = blankDone();
if(!state.weights) state.weights = blankWeights();

for(let i=0;i<exercises.length;i++){
  if(!Array.isArray(state.done[i]) || state.done[i].length !== exercises[i].sets){
    const old = Array.isArray(state.done[i]) ? state.done[i] : [];
    state.done[i] = Array.from({length:exercises[i].sets},(_,j)=>!!old[j]);
  }
  if(!Array.isArray(state.weights[i])){
    const old = state.weights[i] ?? "";
    state.weights[i] = Array(exercises[i].sets).fill(old);
  } else if(state.weights[i].length !== exercises[i].sets){
    const old = state.weights[i];
    state.weights[i] = Array.from({length:exercises[i].sets},(_,j)=>old[j] ?? "");
  }
}

let timerRemaining = 0;
let timerInterval = null;
let wakeLock = null;

function save(){ localStorage.setItem("seancePecsDosStateV2", JSON.stringify(state)); }

function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function renderTimer(){ document.getElementById("timer").textContent = fmt(timerRemaining); }

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value = 0.08;
    osc.start(); setTimeout(()=>{osc.stop();ctx.close();},350);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,100,180]);
}

function startTimer(seconds){
  clearInterval(timerInterval);
  timerRemaining = seconds;
  renderTimer();
  document.getElementById("timerBtn").textContent = "Pause";
  timerInterval = setInterval(()=>{
    timerRemaining--;
    renderTimer();
    if(timerRemaining <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      timerRemaining = 0;
      renderTimer();
      document.getElementById("timerBtn").textContent = "Démarrer";
      beep();
    }
  },1000);
}

function toggleTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
    document.getElementById("timerBtn").textContent = "Reprendre";
  } else {
    if(timerRemaining <= 0) timerRemaining = exercises[state.current]?.rest || 60;
    startTimer(timerRemaining);
  }
}

function resetTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  timerRemaining = 0;
  renderTimer();
  document.getElementById("timerBtn").textContent = "Démarrer";
}

function toggleSet(i){
  state.done[state.current][i] = !state.done[state.current][i];
  save();
  render();
  if(state.done[state.current][i]) startTimer(exercises[state.current].rest);
}

function setWeight(setIndex, value){
  if(!Array.isArray(state.weights[state.current])){
    state.weights[state.current] = Array(exercises[state.current].sets).fill("");
  }
  state.weights[state.current][setIndex] = value;
  save();
}

function nextExercise(){
  if(state.current < exercises.length-1){
    state.current++;
    resetTimer();
    save(); render();
    window.scrollTo({top:0,behavior:"smooth"});
  }else{
    document.getElementById("exerciseCard").style.display="none";
    document.getElementById("allDone").style.display="block";
  }
}

function prevExercise(){
  if(state.current>0){
    state.current--;
    resetTimer();
    save(); render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

function openTipSheet(){
  const e = exercises[state.current];
  document.getElementById("tipSheetTitle").textContent = "Consigne · " + e.name;
  document.getElementById("tipSheetText").textContent = e.cue;
  document.getElementById("tipSheet").classList.add("open");
}

function closeTipSheet(evt){
  if(evt && evt.target !== document.getElementById("tipSheet")) return;
  document.getElementById("tipSheet").classList.remove("open");
}

function resetSession(){
  state = {current:0, done:blankDone(), weights:state.weights || blankWeights()};
  resetTimer();
  save();
  document.getElementById("exerciseCard").style.display="block";
  document.getElementById("allDone").style.display="none";
  render();
}

function render(){
  const e = exercises[state.current];
  const doneSets = state.done.flat().filter(Boolean).length;
  const totalSets = exercises.reduce((n,x)=>n+x.sets,0);
  const doneBlocks = state.done.filter(arr=>arr.every(Boolean)).length;

  document.getElementById("progress").style.width = ((doneSets/totalSets)*100)+"%";
  document.getElementById("progressText").textContent = `Bloc ${state.current+1} / ${exercises.length}`;
  document.getElementById("setProgress").textContent = `${doneSets} / ${totalSets} séries`;
  document.getElementById("summary").textContent = `${exercises.length} blocs • 14 exercices réels • ${totalSets} séries prévues • ${doneBlocks} blocs terminés`;

  let setsHTML = "";
  for(let i=0;i<e.sets;i++){
    const weight = (state.weights[state.current] && state.weights[state.current][i]) || "";
    setsHTML += `
      <div class="set-block ${state.done[state.current][i] ? "done" : ""}">
        <div class="set-top">
          <button class="set-check" onclick="toggleSet(${i})">
            ${state.done[state.current][i] ? "✓ Série "+(i+1) : "Série "+(i+1)}
          </button>
          <div class="set-reps">${e.reps} reps</div>
        </div>
        <input class="weight-input" type="text" inputmode="decimal"
          placeholder="Charge série ${i+1} (ex. 80 kg)"
          value="${weight}" oninput="setWeight(${i}, this.value)" />
      </div>`;
  }

  document.getElementById("exerciseCard").innerHTML = `
    <div class="card current">
      <div class="tag">${e.group}</div>
      <div class="ex-title">${e.name}</div>
      <div class="meta">${e.sets} séries • ${e.reps} reps • repos ${fmt(e.rest)}</div>
      <div class="sets">${setsHTML}</div>
      <div class="row">
        <button class="ghost" onclick="startTimer(${e.rest})">Lancer repos ${fmt(e.rest)}</button>
      </div>
      <button class="tip-btn" onclick="openTipSheet()">
        <span>Consigne / astuce</span><span>↑</span>
      </button>
    </div>`;
}

async function enableWakeLock(){
  try{
    if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") enableWakeLock(); });
enableWakeLock();
render();
renderTimer();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
