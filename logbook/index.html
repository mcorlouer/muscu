<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logbook">
<meta name="theme-color" content="#24282D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#24282D; --surf:#2E3339; --surf2:#3A4047; --line:#454C55;
  --ink:#F1F2F3; --muted:#9AA3AD;
  --orange:#FF7A1A; --red:#E5384B; --yellow:#F2C12E; --green:#3FA66A;
  --acc:var(--orange); --acc-ink:#1d1f22;
  --num:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --txt:"Barlow", system-ui, -apple-system, sans-serif;
  --navh:56px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--txt);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body[data-phase="force"]{--acc:var(--red);--acc-ink:#fff}
body[data-phase="hypertrophie_intensifiee"]{--acc:var(--yellow)}
body[data-phase="decharge"]{--acc:var(--green);--acc-ink:#fff}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;-webkit-user-select:text;user-select:text}
textarea{min-height:90px;font-size:13px}
#app{max-width:560px;margin:0 auto;min-height:100%}
main{padding:14px 18px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}
main.full{padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
h1{font:700 34px/1.05 var(--num);margin:4px 0 6px}
h2{font:600 25px/1.1 var(--num);margin:28px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.4}
.phase-tag{display:inline-block;font:600 17px var(--num);color:var(--acc)}
.stripe{height:6px;border-radius:3px;background:var(--acc);margin:10px 0 6px}
.ok{color:var(--green)} .ko{color:var(--red)}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;height:var(--navh);font:600 17px var(--num);color:var(--muted)}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}

/* Boutons */
.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:14px;font:700 24px var(--num);background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:var(--surf2);color:var(--ink)}
.btn.small{padding:12px;font-size:19px}
.btn.danger{background:var(--red);color:#fff}
.row{display:flex;gap:10px}
.row>*{flex:1}
.link{color:var(--muted);font:600 16px var(--num);padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

/* Programme d'une séance, par groupe musculaire */
.grp{font:700 22px var(--num);color:var(--acc);margin:22px 0 2px}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan .t{flex:1}
.plan .name{font:600 21px/1.15 var(--num)}
.plan .meta{color:var(--muted);font-size:15px;margin-top:2px}
.plan .kg{font:700 26px var(--num);text-align:right;white-space:nowrap}
.plan .kg small{font-size:15px;color:var(--muted)}
.plan li.done{opacity:.4}
.plan li.cur{box-shadow:inset 4px 0 0 var(--acc);padding-left:12px}

/* Séance en cours : tout tient en hauteur */
.act{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 16px);gap:min(1.3vh,12px);overflow-y:auto;overflow-x:hidden}
.act>*{flex-shrink:0}
.act-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.act-top .phase-tag{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.eta{font-size:13px;color:var(--muted);white-space:nowrap;flex:none;margin-right:auto;padding-left:2px}
.chip .du{display:block;font-size:12px;opacity:.7;font-weight:400}
.act-top .links{display:flex;gap:12px;flex:none}
.progress{display:flex;gap:3px}
.progress i{flex:1;height:5px;border-radius:2px;background:var(--surf2)}
.progress i.d{background:var(--acc)}
.progress i.c{background:var(--ink)}
.exo-name{font:700 clamp(26px,4.3vh,38px)/1.02 var(--num);margin:0}
.sets{display:flex;align-items:center;gap:8px;padding:5px 4px;--d:min(clamp(28px,4.6vh,40px),calc((100vw - 40px) * .56 / var(--n,4) - 8px))}
.sets i{flex:none;width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--d) * .52) var(--num);font-style:normal;background:var(--surf2);color:var(--muted)}
.sets i.d{background:var(--acc);color:var(--acc-ink)}
.sets i.c{background:var(--ink);color:var(--bg);box-shadow:0 0 0 3px var(--acc);margin:0 3px}
.sets b{font:700 clamp(18px,min(3vh,5.6vw),26px) var(--num);margin-left:auto;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sets b.last{color:var(--acc)}
.tempo{display:flex;align-items:stretch;gap:10px;background:var(--surf);border-radius:12px;padding:8px 10px}
.tempo .tn{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tempo .tn div{text-align:center;border-radius:8px;padding:2px 0;transition:background .15s}
.tempo .tn b{display:block;font:700 clamp(24px,3.6vh,32px)/1.05 var(--num)}
.tempo .tn span{font-size:12px;color:var(--muted)}
.tempo .tn div.on{background:var(--acc);color:var(--acc-ink)}
.tempo .tn div.on span{color:inherit}
.tempo .tg{width:14px;border-radius:7px;background:var(--surf2);position:relative}
.tempo .tg i{position:absolute;left:1px;width:12px;height:12px;border-radius:50%;background:var(--acc);top:0}
.tempo .tt{font:600 15px var(--num);color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.info{font-size:14px;color:var(--muted);line-height:1.35}
.info b{color:var(--ink);font-weight:600}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1 0 auto}
.box{background:var(--surf);border-radius:14px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.box label{font:600 16px var(--num);color:var(--muted);text-align:center}
.box .v{font:700 clamp(40px,7.5vh,84px)/1 var(--num);text-align:center;width:100%;letter-spacing:-1px}
.box .v small{font-size:.38em;color:var(--muted);letter-spacing:0;margin-left:2px}
.box .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.box .g button{background:var(--surf2);border-radius:10px;height:clamp(40px,5.6vh,52px);font:700 clamp(20px,2.8vh,26px) var(--num)}
.rpe{display:flex;align-items:center;gap:10px}
.rpe label{font:600 15px var(--num);color:var(--muted);white-space:nowrap}
.rpe input{flex:1;padding:0;border:0;background:none;accent-color:var(--acc);height:30px}
.rpe .rv{font:700 24px var(--num);width:44px;text-align:right}
.validate{padding:clamp(14px,2.4vh,22px);font-size:clamp(26px,3.6vh,32px)}
.next{background:var(--surf);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.3}
.next b{font:700 19px var(--num)}
.next.hot{background:var(--acc);color:var(--acc-ink)}
.next.hot .muted{color:inherit;opacity:.8}
.act-links{display:flex;justify-content:space-between}
@media (max-height:740px){
.act{gap:7px}
.exo-name{font-size:clamp(22px,3.9vh,30px)}
.tempo{padding:4px 8px}.tempo .tn b{font-size:21px}.tempo .tn span{font-size:11px}
.info{font-size:13px;line-height:1.25}
.box{padding:6px}.box label{font-size:14px}.box .g button{height:36px;font-size:19px}
.rpe input{height:22px}.rpe .rv{font-size:20px}
.validate{padding:11px;font-size:24px}
.next{padding:6px 10px;font-size:13px;line-height:1.25}.next b{font-size:16px}
}
@media (max-height:820px){
.note{padding:5px 9px;font-size:14px;line-height:1.25}
.addnote{font-size:13px}
.rpe{margin:-4px 0}
.act{gap:min(1.1vh,10px)}
}

/* Chrono plein écran */
.timer{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px}
.timer .lbl{font:600 24px var(--num);color:var(--muted)}
.timer .dig{font:700 min(40vw,24vh)/1 var(--num);letter-spacing:-3px;font-variant-numeric:tabular-nums}
.timer .bar{height:10px;background:var(--surf2);border-radius:5px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--acc);transform-origin:left;transition:transform .2s linear}
.timer .next{text-align:left}

/* Flash et toast */
#flash{position:fixed;inset:0;background:var(--acc);opacity:0;pointer-events:none;z-index:90}
#flash.on{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%,80%{opacity:.95}20%,60%{opacity:.1}100%{opacity:0}}
#toast{position:fixed;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 18px;z-index:80;transform:translateY(-160%);transition:transform .3s;box-shadow:0 0 0 3px var(--acc)}
#toast.on{transform:none}
#toast b{display:block;font:700 24px var(--num)}

/* Modale */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.modal h3{font:700 28px var(--num);margin:0 0 6px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--surf2);border-radius:12px;padding:14px 16px;font-weight:600}
.opt small{display:block;font-weight:400;color:var(--muted)}
.opt.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.sets i.d{cursor:pointer}
.sc{display:inline-block;background:var(--surf2);border-radius:8px;padding:3px 8px;margin:4px 4px 0 0;font:600 15px var(--num);color:var(--ink)}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.edit.one{grid-template-columns:1fr}
.edit .box .v{font-size:46px}
.edit .box .g button{height:44px;font-size:20px}
.warm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.warm button{display:flex;align-items:center;gap:12px;width:100%;background:var(--surf);border-radius:12px;padding:12px 14px;text-align:left}
.warm .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-weight:700}
.warm .on .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.warm .on{opacity:.55}
.warm b{font:700 24px var(--num)}
.warm span.p{color:var(--muted);font-size:14px;margin-left:auto}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surf);border-radius:12px;padding:10px 14px}
.wk b{font:700 30px var(--num)}
.wk .g{display:flex;gap:6px}
.wk .g button{background:var(--surf2);border-radius:10px;width:58px;height:42px;font:700 19px var(--num)}
.bilan td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.bilan .dl{font:700 16px var(--num);white-space:nowrap}
.dl.up{color:var(--green)} .dl.down{color:var(--red)} .dl.eq{color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tip{min-height:20px;font-size:14px;color:var(--ink);margin-top:4px}
.note{display:block;width:100%;text-align:left;background:color-mix(in srgb,var(--acc) 16%,var(--surf));border-left:4px solid var(--acc);border-radius:10px;padding:7px 10px;font-size:15px;line-height:1.3;color:var(--ink)}
.note b{font-weight:700}
.addnote{font-size:14px;color:var(--muted);text-decoration:underline;text-align:left}
.pnote{font-size:14px;color:var(--ink);font-style:italic;margin-top:3px}
.next .nk{font:700 26px var(--num);white-space:nowrap}
.next .nn{display:block;font-size:14px;font-style:italic;margin-top:3px;opacity:.9}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:16px var(--txt);padding:10px}
.pz{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}

/* Cycle */
.timeline{display:flex;align-items:flex-end;gap:4px;height:110px;margin:14px 0 4px}
.timeline div{flex:1;border-radius:4px 4px 0 0;position:relative}
.timeline div.now::after{content:"";position:absolute;left:50%;top:-14px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ink)}
.tl-legend{display:flex;gap:4px;font:600 13px var(--num);color:var(--muted)}
.tl-legend span{flex:1;text-align:center}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.phases div{background:var(--surf);border-radius:12px;padding:12px;border-top:4px solid var(--c)}
.phases b{font:700 20px var(--num);display:block}
.phases em{font-style:normal;font-weight:600;font-size:14px}
.phases p{font-size:13px;color:var(--muted);margin:4px 0 0}
.week{padding:12px 0;border-bottom:1px solid var(--line)}
.week .wh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.week .wh b{font:700 22px var(--num)}
.week .ph{font:600 16px var(--num)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.chip{background:var(--surf);border-radius:10px;padding:8px 7px;text-align:left;font-size:13px;line-height:1.25;border-top:4px solid var(--c)}
.chip .d{display:block;font:700 15px var(--num);color:var(--muted)}
.chip b{display:block;font:600 16px/1.1 var(--num);margin:2px 0}
.chip.faite{opacity:.45}
.chip.sautee{opacity:.3;text-decoration:line-through}
.chip.today{box-shadow:0 0 0 2px var(--ink)}

/* Progrès */
.card{background:var(--surf);border-radius:14px;padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--surf);border-radius:12px;padding:12px}
.kpis b{display:block;font:700 30px var(--num)}
.kpis span{font-size:14px;color:var(--muted)}
.exlist button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;gap:10px}
.exlist .nm{font:600 19px var(--num)}
.exlist .kg{font:700 22px var(--num);text-align:right}
.exlist .up{display:block;font:600 14px var(--txt);color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
svg text{fill:var(--muted);font:500 12px var(--txt)}

/* Chronos */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools button{background:var(--surf);border-radius:14px;padding:18px 14px;text-align:left}
.tools button b{display:block;font:700 26px var(--num)}
.cfg{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cfg .s{display:flex;align-items:center;gap:14px}
.cfg .s button{width:48px;height:48px;border-radius:50%;background:var(--surf2);font:600 26px var(--num)}
.cfg .s span{font:700 30px var(--num);min-width:64px;text-align:center}
.tool-timer{display:flex;flex-direction:column;justify-content:center;min-height:60vh;text-align:center;gap:14px}
.tool-timer .dig{font:700 min(40vw,24vh)/1 var(--num);letter-spacing:-3px}

/* Réglages */
.step{background:var(--surf);border-radius:14px;padding:14px;margin-top:14px}
.step h2{margin:0 0 4px;font-size:23px}
.step .st{font:600 16px var(--num)}
.form label{display:block;margin:12px 0 6px;color:var(--muted);font-size:15px}
details{background:var(--surf);border-radius:14px;padding:14px;margin-top:14px}
summary{font:600 21px var(--num);cursor:pointer}
.net{font-size:13px;color:var(--muted);text-align:right;min-height:4px}
.net.err{color:var(--red)}
.empty{padding:40px 0;text-align:center}
@media (prefers-reduced-motion: reduce){#flash.on{animation-duration:2.4s}.timer .bar i{transition:none}}
</style>

</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<div id="toast"></div>
<script>
'use strict';
const APP_VERSION = '9';

/* ---------- Utilitaires ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('lb_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lb_' + k, JSON.stringify(v)); } catch {} }
};
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const PHASES = { hypertrophie: 'Hypertrophie', force: 'Force', hypertrophie_intensifiee: 'Hypertrophie intensifiée' };
const PHASE_COL = { hypertrophie: 'var(--orange)', force: 'var(--red)', hypertrophie_intensifiee: 'var(--yellow)', decharge: 'var(--green)' };
const PHASE_INFO = {
  hypertrophie: ['8 à 15 reps', 'Volume élevé pour construire du muscle. On monte l’effort semaine après semaine.'],
  force: ['4 à 6 reps sur les gros mouvements', 'Charges lourdes, repos longs. Plus de force, donc plus de charge pour la phase suivante.'],
  hypertrophie_intensifiee: ['6 à 12 reps', 'Retour au volume avec les charges gagnées, dégressives et rest-pause en fin d’exercice.'],
  decharge: ['Moitié des séries, −10 %', 'Semaine allégée pour récupérer et absorber le travail.']
};
const GROUPES = { pecs: 'Pectoraux', dos: 'Dos', quadriceps: 'Quadriceps', ischios: 'Ischio-jambiers', fessiers: 'Fessiers', adducteurs: 'Adducteurs', mollets: 'Mollets', abdos: 'Abdos', epaules: 'Épaules', biceps: 'Biceps', triceps: 'Triceps' };
const z = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const fmtDate = (s, long) => { const d = parseISO(s); return (long ? JOURS[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MOIS[d.getMonth()]; };
const fmtNum = x => (x === null || x === undefined || x === '' || isNaN(x)) ? '–' : String(Math.round(x * 100) / 100).replace('.', ',');
const round25 = (x, down) => (down ? Math.floor : Math.round)(x / 2.5) * 2.5;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + z(s % 60); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const e1rm = (c, r) => (c > 0 && r >= 1 && r <= 12) ? c * (1 + r / 30) : null;
const num = v => (v === '' || v === null || v === undefined) ? null : Number(v);

/* Rejoue sur les données du Sheet les actions pas encore envoyées */
function applyOp(q) {

  else if (q.action === 'addModification') { if (!has(H.modifications)) H.modifications.push(d); }
  else if (q.action === 'addPoids') { if (!has(H.poids)) H.poids.push(d); }
  else if (q.action === 'deletePoids') H.poids = H.poids.filter(x => x.id !== d.id);
  else if (q.action === 'setNote') { H.notes = H.notes.filter(x => x.exercice_id !== d.exercice_id); if (d.texte) H.notes.push(d); }

}
async function refresh() {

let seqCache = null;

/* ---------- Programme ---------- */

/* ---------- Historique, cibles, records ---------- */
const workSets = id => H.series.filter(r => r.exercice_id === id && r.type === 'normale');

  if (T.mode === 'chrono' && T.sw.running) {
    const el = document.getElementById('tool-dig'); if (el) el.textContent = mmss((T.sw.acc + Date.now() - T.sw.start) / 1000 - 0.5);
    return;

  if (!T.running) return;

/* Animation du tempo : la pastille suit la charge (descente, pause, montée, pause) */
function tempoAnim() {
  const box = document.getElementById('tempo');
  if (box) {
    const parts = tempoParts(box.dataset.t).map(v => v === 'X' ? 0.7 : v);
    const total = parts.reduce((a, b) => a + b, 0) || 1;
    let t = (Date.now() / 1000) % total, ph = 0;
    while (ph < 3 && t >= parts[ph]) { t -= parts[ph]; ph++; }
    const f = parts[ph] ? t / parts[ph] : 1;
    const pos = ph === 0 ? f : ph === 1 ? 1 : ph === 2 ? 1 - f : 0;
    const tg = document.getElementById('tg'), dot = document.getElementById('tgi');
    if (tg && dot) dot.style.top = (pos * (tg.clientHeight - 14) + 1) + 'px';
    for (let i = 0; i < 4; i++) { const el = document.getElementById('tp' + i); if (el) el.classList.toggle('on', i === ph); }
  }
  requestAnimationFrame(tempoAnim);
}
requestAnimationFrame(tempoAnim);

/* Courbe sur échelle de temps, une seule échelle (kg). series: [{name, color, dash, pts:[{x:date,y}]}] ; band: [{x, lo, hi}] */

  const band = opt.band && opt.band.length > 1 ? `<path d="${opt.band.map((b, i) => (i ? 'L' : 'M') + X(b.x).toFixed(1) + ' ' + Y(b.hi).toFixed(1)).join(' ')} ${[...opt.band].reverse().map(b => 'L' + X(b.x).toFixed(1) + ' ' + Y(b.lo).toFixed(1)).join(' ')} Z" fill="var(--green)" opacity=".16"/>` : '';

    if (!s.pts.length) return '';

    const dots = s.pts.map(p => { const k = chartTips[key].push(`${fmtDate(p.x, true)} : ${s.name ? s.name.toLowerCase() + ' ' : ''}${fmtNum(Math.round(p.y * 10) / 10)} kg`) - 1;
      return `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--surf)" stroke-width="2"/><circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="16" fill="transparent" data-a="tip" data-k="${key}" data-v="${k}"/>`; }).join('');

    <text x="${L}" y="${Hh - 6}">${fmtDate(iso(new Date(x0)))}</text><text x="${W - Rt}" y="${Hh - 6}" text-anchor="end">${fmtDate(iso(new Date(x1)))}</text></svg>
    <div class="tip" id="tip-${key}">Touchez un point pour voir sa valeur.</div>`;

  if (sub.type === 'plan') {
    const s = plan()[sub.i];
    return `<button class="link" data-a="back">Retour</button><span class="phase-tag" style="display:block;color:${PHASE_COL[phaseKey(s)]}">Semaine ${s.week}, ${phaseLabel(s).toLowerCase()}</span><h1>${esc(P.seances[s.seance].nom)}</h1><p class="muted">${fmtDate(s.date, true)}${s.deplacee ? ` (prévue ${fmtDate(s.dateSlot, true)})` : ''}${s.statut ? ', ' + (s.statut === 'faite' ? 'faite' : 'sautée') : `, environ ${fmtDur(estSession(s))}`}</p>${!s.statut && !(A && A.i === s.i) ? `<div style="margin:8px 0 14px"><button class="btn small ghost" data-a="move-ask" data-v="${s.i}">Changer de jour</button></div>` : ''}${s.statut ? `<div style="margin:8px 0 14px"><button class="btn small ghost" data-a="cancel-ask" data-v="${s.i}">${s.statut === 'faite' ? 'Annuler : remettre à faire' : 'Ne plus la sauter : remettre à faire'}</button></div>` : ''}<div class="stripe" style="background:${PHASE_COL[phaseKey(s)]}"></div>${planList(s, false)}`;
  }
  return '';
}

/* Chronos */
function cfgRow(label, key, field, step, fmt) {
  const v = tool[key][field];
  return `<div class="cfg"><span>${label}</span><div class="s"><button data-a="tcfg" data-k="${key}" data-f="${field}" data-v="${-step}">−</button><span>${fmt ? fmt(v) : v}</span><button data-a="tcfg" data-k="${key}" data-f="${field}" data-v="${step}">+</button></div></div>`;
}
function renderChronos() {
  if (!T.mode) return `<h1>Chronos</h1><p class="muted">Indépendants du programme, utilisables à tout moment.</p><div class="tools" style="margin-top:18px">
    <button data-a="tool" data-v="tabata"><b>Tabata</b><span class="muted">Effort et repos en boucle</span></button>
    <button data-a="tool" data-v="emom"><b>EMOM</b><span class="muted">Un départ chaque minute</span></button>
    <button data-a="tool" data-v="minuteur"><b>Minuteur</b><span class="muted">Compte à rebours</span></button>
    <button data-a="tool" data-v="chrono"><b>Chronomètre</b><span class="muted">Temps écoulé</span></button></div>`;
  const back = `<button class="link" data-a="tool-exit">Retour</button>`;
  if (T.mode === 'chrono') {
    const el = (T.sw.acc + (T.sw.running ? Date.now() - T.sw.start : 0)) / 1000;
    return back + `<div class="tool-timer"><div class="muted">Chronomètre</div><div class="dig" id="tool-dig">${mmss(el - 0.5)}</div><div class="row"><button class="btn" data-a="sw">${T.sw.running ? 'Pause' : 'Démarrer'}</button><button class="btn ghost" data-a="sw-reset">Remettre à zéro</button></div></div>`;
  }
  if (T.running || T.paused) {
    const seg = T.segs[T.idx]; const rem = T.paused ? T.paused : (T.end - Date.now()) / 1000;
    return back + `<div class="tool-timer"><div class="muted">${esc(seg.label)}${seg.round ? `, tour ${seg.round} sur ${seg.of}` : ''}</div><div class="dig" id="tool-dig">${mmss(rem)}</div>
      <div class="row"><button class="btn" data-a="tool-pause">${T.paused ? 'Reprendre' : 'Pause'}</button><button class="btn ghost" data-a="tool-stop">Arrêter</button></div></div>`;
  }
  const done = T.segs.length && T.idx >= T.segs.length ? '<p class="phase-tag">Terminé</p>' : '';
  if (T.mode === 'tabata') return back + `<h1>Tabata</h1>${done}${cfgRow('Effort', 'tabata', 'work', 5, v => v + ' s')}${cfgRow('Repos', 'tabata', 'rest', 5, v => v + ' s')}${cfgRow('Tours', 'tabata', 'rounds', 1)}<div style="margin-top:22px"><button class="btn" data-a="tool-go">Démarrer</button></div>`;
  if (T.mode === 'emom') return back + `<h1>EMOM</h1>${done}${cfgRow('Minutes', 'emom', 'min', 1)}<div style="margin-top:22px"><button class="btn" data-a="tool-go">Démarrer</button></div>`;
  return back + `<h1>Minuteur</h1>${done}${cfgRow('Durée', 'minuteur', 'sec', 15, v => mmss(v))}<div style="margin-top:22px"><button class="btn" data-a="tool-go">Démarrer</button></div>`;
}

/* Réglages */

    <p class="muted">À faire une seule fois, dans l’ordre : connecter l’app à votre Google Sheet, puis charger le programme.</p>
    <div class="step form"><h2>1. Connexion au Google Sheet</h2>
      <p class="st ${connected ? 'ok' : cfg.url ? 'ko' : 'muted'}">${connected ? 'Connecté' : cfg.url ? (net.ok ? 'Pas encore testé' : 'Échec : ' + esc(net.msg)) : 'Pas encore connecté'}</p>
      ${connected && scriptV < 3 ? '<p class="ko small">Script Google à mettre à jour : colle la nouvelle version de Code.gs puis Déployer > Gérer les déploiements > crayon > Nouvelle version. Sans ça, les corrections de séries, le poids et les notes ne sont pas enregistrés dans le Sheet.</p>' : ''}
      <p class="muted small">C’est là que vos séries sont enregistrées. L’adresse est celle obtenue en déployant le script Google (elle se termine par /exec). Le mot de passe est celui saisi dans le script (propriété TOKEN).</p>

    <div class="step form"><h2>2. Programme d’entraînement</h2>

    <div class="step"><h2>Vos données</h2>

    ${P ? `<details class="form"><summary>Ajouter une série oubliée</summary><p class="muted small">Pour reporter une série notée ailleurs, par exemple sur papier.</p>

      <div style="margin-top:12px"><button class="btn small ghost" data-a="manual">Ajouter</button></div></details>` : ''}

/* Modales */
function renderModal() {
  let inner = '';
  if (modal.type === 'missed') {
    const s = plan()[modal.i];
    inner = `<h3>Séance non faite</h3><p>${esc(P.seances[s.seance].nom)}, prévue ${fmtDate(s.date, true)}.</p>
      <div class="opts"><button class="opt" data-a="move-ask" data-v="${s.i}">La faire un autre jour<small>Tu choisis le jour, le reste du planning ne bouge pas.</small></button>
      <button class="opt" data-a="missed" data-v="decalee">Tout décaler<small>Elle devient la prochaine séance, tout le planning glisse d’un créneau.</small></button>
      <button class="opt" data-a="missed" data-v="sautee">Sauter<small>Elle est abandonnée, le planning ne bouge pas.</small></button>
      <button class="opt" data-a="modal-close">Plus tard</button></div>`;
  } else if (modal.type === 'move') {
    const pl = plan(), s = pl[modal.i], t = todayISO();
    const days = moveDays(s).map(d => {
      const autres = pl.filter(o => o.i !== s.i && o.date === d && o.statut !== 'sautee').map(o => P.seances[o.seance].nom + (o.statut === 'faite' ? ' (faite)' : ''));
      const lbl = (d === t ? 'Aujourd’hui, ' : '') + fmtDate(d, true);
      const note = [d === s.dateSlot ? 'jour prévu au programme' : '', autres.length ? 'déjà : ' + autres.join(', ') : ''].filter(Boolean).join(' · ');
      return `<button class="opt${d === s.date ? ' sel' : ''}" data-a="move-pick" data-v="${d}">${lbl}${d === s.date ? ' ✓' : ''}${note ? `<small>${esc(note)}</small>` : ''}</button>`;
    }).join('');
    inner = `<h3>Changer de jour</h3><p class="muted">${esc(P.seances[s.seance].nom)}, semaine ${s.week}. Les autres séances restent à leur place.</p>
      <div class="opts">${days}<button class="opt" data-a="modal-close">Annuler</button></div>`;
  } else if (modal.type === 'set') {
    const r = findSet(modal.id);
    if (!r) { modal = null; return ''; }
    const ex = EX(r.exercice_id), temps = ex.mesure === 'temps';
    const box = (lbl, k, v, unit, steps) => `<div class="box"><label>${lbl}</label><div class="v">${fmtNum(v)}${unit ? `<small>${unit}</small>` : ''}</div><div class="g">${steps.map(x => `<button data-a="set-adj" data-k="${k}" data-v="${x}">${x > 0 ? '+' : '−'}${fmtNum(Math.abs(x))}</button>`).join('')}</div></div>`;
    inner = `<h3>${esc(ex.nom)}</h3><p class="muted">${fmtDate(r.date, true)}, série ${r.numero_serie}${r.type !== 'normale' ? (r.type === 'degressive' ? ' (dégressive)' : ' (rest-pause)') : ''}</p>
      ${scriptV < 2 ? '<p class="ko small">Le script Google n’est pas à jour : la correction ne sera pas envoyée au Sheet. Voir Réglages, étape 1.</p>' : ''}
      <div class="edit ${temps ? 'one' : ''}">${temps ? box('Durée', 'duree_s', modal.duree_s, 's', [-5, 5]) : box('Reps', 'reps', modal.reps, '', [-1, 1]) + box('Charge', 'charge_kg', modal.charge_kg, 'kg', [-2.5, 2.5, -5, 5])}</div>
      <div class="opts"><button class="btn" data-a="set-save">Enregistrer la correction</button>
      <button class="opt" data-a="set-del" style="color:var(--red)">${modal.confirmDel ? 'Confirmer : supprimer définitivement' : 'Supprimer cette série'}${r.type === 'normale' && H.series.some(x => x.serie_parent_id === r.id) ? '<small>La dégressive ou le rest-pause rattaché sera aussi supprimé.</small>' : ''}</button>
      <button class="opt" data-a="set-cancel">Annuler</button></div>`;
  } else if (modal.type === 'note') {
    inner = `<h3>Note : ${esc(EX(modal.id).nom)}</h3><p class="muted small">Elle s’affichera à chaque fois que tu feras cet exercice, et pendant le repos qui le précède.</p>
      ${scriptV < 3 ? '<p class="ko small">Le script Google n’est pas à jour : la note restera sur ce téléphone seulement. Voir Réglages, étape 1.</p>' : ''}
      <textarea id="note-txt" maxlength="300" placeholder="Ex. : siège cran 4, prises serrées, monter à 35 kg la prochaine fois">${esc(noteOf(modal.id))}</textarea>
      <div class="opts" style="margin-top:12px"><button class="btn" data-a="note-save">Enregistrer</button>${noteOf(modal.id) ? '<button class="opt" data-a="note-del" style="color:var(--red)">Effacer la note</button>' : ''}<button class="opt" data-a="modal-close">Annuler</button></div>`;
  } else if (modal.type === 'suspect') {
    inner = `<h3>Vérifie ta saisie</h3><p>${esc(modal.msg)}</p><div class="opts">
      <button class="opt" data-a="suspect-fix">${modal.effort ? 'Ne pas enregistrer, relancer' : 'Corriger'}</button>
      <button class="opt" data-a="suspect-ok">Enregistrer quand même</button></div>`;
  } else if (modal.type === 'skip') {
    const it = curIt(), n = it.sets.length;
    inner = `<h3>Passer ${esc(it.exId ? EX(it.exId).nom : 'cet exercice')} ?</h3><p class="muted">${n ? `Les ${n} série(s) déjà faites restent enregistrées.` : 'Aucune série ne sera enregistrée pour cet exercice.'} Tu passes directement à l’exercice suivant.</p>
      <div class="opts"><button class="opt" data-a="skip-ok">Passer l’exercice</button><button class="opt" data-a="modal-close">Annuler</button></div>`;
  } else if (modal.type === 'poids') {
    inner = `<h3>Nouvelle pesée</h3><p class="muted">${fmtDate(todayISO(), true)}, le matin à jeun de préférence.</p>
      <div class="edit one"><div class="box"><label>Poids</label><div class="v">${fmtNum(modal.v)}<small>kg</small></div><div class="g" style="grid-template-columns:repeat(4,1fr)">${[-1, -0.1, 0.1, 1].map(x => `<button data-a="poids-adj" data-v="${x}">${x > 0 ? '+' : '−'}${fmtNum(Math.abs(x))}</button>`).join('')}</div></div></div>
      <div class="opts"><button class="btn" data-a="poids-save">Enregistrer</button><button class="opt" data-a="modal-close">Annuler</button></div>`;
  } else if (modal.type === 'overview') {
    inner = `<h3>Toute la séance</h3>${planList(curS(), true)}<div class="opts"><button class="opt" data-a="modal-close">Fermer</button></div>`;
  } else if (modal.type === 'replace') {
    const it = curIt(), def = curDef(), base = EX(def.exercice), cur = EX(it.exId);
    const ids = [...new Set([...(def.choix || []), ...(base.alternatives || []), ...(cur.alternatives || []), ...Object.values(P.exercices).filter(e => e.groupe === cur.groupe).map(e => e.id)])].filter(id => id !== it.exId && !A.items.some((o, k) => k !== A.cur.item && o.exId === id));
    inner = `<h3>Remplacer ${esc(cur.nom)}</h3><div class="opts">${ids.map(id => `<button class="opt" data-a="rep-pick" data-v="${id}">${esc(EX(id).nom)}</button>`).join('')}<button class="opt" data-a="modal-close">Annuler</button></div>`;
  } else if (modal.type === 'replace-scope') {
    inner = `<h3>${esc(EX(modal.id).nom)}</h3><p class="muted">Pour combien de temps ?</p><div class="opts">
      <button class="opt" data-a="rep-scope" data-v="today">Juste aujourd’hui</button>
      <button class="opt" data-a="rep-scope" data-v="always">Pour les prochaines séances<small>Remplace l’exercice à cette place jusqu’à la fin du bloc.</small></button>
      <button class="opt" data-a="modal-close">Annuler</button></div>`;
  } else if (modal.type === 'stop') {
    const any = A.items.some(it => it.sets.length);
    inner = `<h3>Arrêter la séance ?</h3><p class="muted">${any ? 'Les séries déjà validées sont enregistrées et la séance sera marquée comme faite.' : 'Aucune série validée, la séance restera à faire.'}</p>
      <div class="opts"><button class="opt" data-a="stop-ok">Arrêter${any ? '<small>Garde les séries et marque la séance comme faite.</small>' : ''}</button>
      ${any ? `<button class="opt" data-a="cancel-ask" data-v="${A.i}" style="color:var(--red)">Annuler la séance<small>Lancée par erreur : supprime les séries validées, la séance redevient à faire à sa date prévue.</small></button>` : ''}
      <button class="opt" data-a="modal-close">Continuer la séance</button></div>`;
  } else if (modal.type === 'cancel') {
    const s = plan()[modal.i], n = H.series.filter(r => r.index_seance === modal.i).length;
    inner = `<h3>Annuler ${esc(P.seances[s.seance].nom)} ?</h3><p class="muted">${n ? `Les ${n} série(s) enregistrée(s) pour cette séance seront supprimées, dans l’app et dans le Sheet.` : 'Aucune série enregistrée pour cette séance.'} Elle redeviendra à faire, prévue ${fmtDate(s.date, true)}</p>
      ${scriptV < 2 && n ? '<p class="ko small">Le script Google n’est pas à jour : les séries resteront dans le Sheet. Voir Réglages, étape 1.</p>' : ''}
      <div class="opts"><button class="btn danger" data-a="cancel-ok">Oui, annuler la séance</button><button class="opt" data-a="modal-close">Garder</button></div>`;
  } else if (modal.type === 'reset') {
    inner = `<h3>Repartir de zéro ?</h3><p class="muted">Toutes les séries, séances et remplacements seront effacés, dans l’app et dans le Google Sheet. Le programme reste chargé. Impossible d’annuler.</p>
      <div class="opts"><button class="btn danger" data-a="reset-ok">Tout effacer</button><button class="opt" data-a="modal-close">Annuler</button></div>`;
  }
  return `<div class="modal-bg" data-a="modal-bg"><div class="modal">${inner}</div></div>`;
}

/* ---------- Actions ---------- */
const ACT = {
  nav(d) { view = d.v; sub = null; navOpen = view !== 'today'; if (view !== 'chronos' && !T.running && !T.sw.running) T.mode = null; render(); },
  menu() { navOpen = true; view = 'cycle'; render(); },
  back() { sub = null; render(); },
  start() { const s = nextSession(); if (s) { navOpen = false; startSession(s); } },
  plan(d) { sub = { type: 'plan', i: +d.v }; render(); },
  exo(d) { sub = { type: 'exo', id: d.v }; render(); },
  overview() { modal = { type: 'overview' }; render(); },
  'modal-close'() { if (modal && modal.type === 'missed') missedDismissed = true; modal = null; render(); },
  'modal-bg'(d, el, ev) { if (ev.target === el) ACT['modal-close'](); },
  'move-ask'(d) { modal = { type: 'move', i: +d.v }; render(); },
  'move-pick'(d) {
    const s = plan()[modal.i];
    if (d.v !== s.date) { moveSession(modal.i, d.v); toast('Séance déplacée', `${P.seances[s.seance].nom} : ${fmtDate(d.v, true)}`); }
    modal = null; missedDismissed = false; render();
  },
  missed(d) {
    const s = plan()[modal.i];
    const row = { id: uid(), horodatage: Date.now(), index_seance: s.i, seance: s.seance, date_prevue: s.date, statut: d.v, date_reelle: '' };
    H.seances.push(row); saveH(); enqueue('addSeance', row); modal = null; render();
  },
  choose(d) { curIt().exId = d.v; A.step = 'input'; A.draft = null; prepareStep(); saveA(); render(); },
  adj(d) {
    const v = +d.v, k = d.k;
    if (k === 'reps') A.draft.reps = Math.max(0, A.draft.reps + v);
    else if (k === 'charge') A.draft.charge = Math.max(0, Math.round((A.draft.charge + v) * 100) / 100);
    else if (k === 'duree') A.draft.duree = Math.max(5, A.draft.duree + v);
    saveA(); render();
  },
  type(d) {
    const cur = A.draft[d.k];
    const v = prompt(d.k === 'charge' ? 'Charge en kg' : 'Répétitions', String(cur).replace('.', ','));
    if (v === null) return;
    const n = parseFloat(v.replace(',', '.'));
    if (!isNaN(n) && n >= 0) { A.draft[d.k] = d.k === 'reps' ? Math.round(n) : n; saveA(); render(); }
  },
  validate() {
    if (A.step === 'input') { const m = suspectMsg(); if (m) { modal = { type: 'suspect', msg: m, kind: 'normale' }; render(); return; } }
    validate('normale');
  },
  'validate-deg'() { validate('degressive'); },
  'validate-rp'() { validate('rest-pause'); },
  'skip-tech'() { afterSet('skip'); },
  'effort-go'() { unlockAudio(); A.step = 'effort'; startTimer(A.draft.duree, 'effort', 'Effort'); saveA(); render(); },
  'effort-stop'() {
    const el = Math.round(A.timer.total - (A.timer.end - Date.now()) / 1000); A.draft.duree = Math.max(1, el); A.timer = null;
    if (A.draft.duree < 10) { A.step = 'input'; modal = { type: 'suspect', msg: suspectMsg(), kind: 'normale', effort: true }; saveA(); render(); return; }
    validate('normale');
  },
  't-add'(d) { A.timer.end += (+d.v) * 1000; A.timer.total = Math.max(1, A.timer.total + (+d.v)); saveA(); tick(); },
  't-skip'() { A.timer.end = Date.now(); tick(); },
  sets(d) {
    const it = curIt(), n = normalCount(it);
    if (+d.v > 0) it.setsPlanned++;
    else { it.setsPlanned = Math.max(1, it.setsPlanned - 1); if (n >= it.setsPlanned && n > 0) { advanceExo(); return; } }
    saveA(); render();
  },
  replace() { modal = { type: 'replace' }; render(); },
  'rep-pick'(d) { modal = { type: 'replace-scope', id: d.v }; render(); },
  'rep-scope'(d) {
    const id = modal.id, it = curIt(), s = curS(), def = curDef();
    if (d.v === 'always') {
      const row = { id: uid(), horodatage: Date.now(), seance: s.seance, ordre: def.ordre, exercice_initial: def.exercice, exercice_remplacant: id, a_partir_de_semaine: s.week };
      H.modifications.push(row); saveH(); enqueue('addModification', row);
    }
    it.exId = id; A.draft = null; makeDraft(); modal = null; saveA(); render();
  },
  'rep-undo'(d) {
    const def = P.seances[d.s].exercices.find(e => e.ordre === +d.o); const ns = nextSession();
    const cur = activeReplacements().find(r => r.sid === d.s && r.ordre === +d.o);
    const row = { id: uid(), horodatage: Date.now(), seance: d.s, ordre: def.ordre, exercice_initial: cur ? cur.rempl : '', exercice_remplacant: def.exercice, a_partir_de_semaine: ns ? ns.week : 1 };
    H.modifications.push(row); saveH(); enqueue('addModification', row);
    toast('Exercice rétabli', EX(def.exercice).nom); render();
  },
  'set-open'(d) {
    const r = findSet(d.v); if (!r) return;
    modal = { type: 'set', id: r.id, reps: r.reps, charge_kg: r.charge_kg, duree_s: r.duree_s || 0, back: modal && modal.type === 'overview' ? 'overview' : null }; render();
  },
  'set-adj'(d) { const k = d.k, min = k === 'charge_kg' ? 0 : 1; modal[k] = Math.max(min, Math.round((modal[k] + +d.v) * 10) / 10); modal.confirmDel = false; render(); },
  'set-save'() {
    const r = findSet(modal.id), temps = EX(r.exercice_id).mesure === 'temps';
    editSet(modal.id, temps ? { duree_s: modal.duree_s } : { reps: modal.reps, charge_kg: modal.charge_kg });
    toast('Série corrigée', ''); modal = modal.back ? { type: modal.back } : null; render();
  },
  'set-del'() {
    if (!modal.confirmDel) { modal.confirmDel = true; render(); return; }
    deleteSet(modal.id); toast('Série supprimée', ''); modal = modal.back ? { type: modal.back } : null;
    if (A && A.step === 'input') { A.draft = null; makeDraft(); }
    render();
  },
  'set-cancel'() { modal = modal.back ? { type: modal.back } : null; render(); },
  'suspect-ok'() { const m = modal; modal = null; validate(m.kind); },
  'suspect-fix'() { if (modal.effort) A.draft.duree = curP().duree_s || 30; modal = null; saveA(); render(); },
  'note-open'(d) { modal = { type: 'note', id: d.v }; render(); setTimeout(() => { const t = document.getElementById('note-txt'); if (t) t.focus(); }, 50); },
  'note-save'() { const t = (document.getElementById('note-txt').value || '').trim().slice(0, 300); saveNote(modal.id, t); modal = null; toast(t ? 'Note enregistrée' : 'Note effacée', ''); render(); },
  'note-del'() { saveNote(modal.id, ''); modal = null; toast('Note effacée', ''); render(); },
  'skip-ask'() { modal = { type: 'skip' }; render(); },
  'skip-ok'() { modal = null; advanceExo(); },
  'warm-tick'(d) { A.warm = A.warm || []; A.warm[+d.v] = !A.warm[+d.v]; saveA(); render(); },
  'warm-adj'(d) { A.draft.charge = Math.max(0, A.draft.charge + +d.v); A.warm = []; saveA(); render(); },
  'warm-done'() { curIt().warmDone = true; A.step = 'input'; saveA(); render(); },
  tip(d) { const el = document.getElementById('tip-' + d.k); if (el && chartTips[d.k]) el.textContent = chartTips[d.k][+d.v]; },
  'poids-open'() { const l = [...H.poids].sort((a, b) => a.date < b.date ? -1 : 1).pop(); modal = { type: 'poids', v: l ? l.poids_kg : 80 }; render(); },
  'poids-adj'(d) { modal.v = Math.max(30, Math.round((modal.v + +d.v) * 10) / 10); render(); },
  'poids-save'() {
    const t = todayISO();
    H.poids.filter(p => p.date === t).forEach(p => enqueue('deletePoids', { id: p.id }));
    H.poids = H.poids.filter(p => p.date !== t);
    const row = { id: uid(), horodatage: Date.now(), date: t, poids_kg: modal.v };
    H.poids.push(row); saveH(); enqueue('addPoids', row); modal = null; toast('Pesée enregistrée', fmtNum(row.poids_kg) + ' kg'); render();
  },
  'poids-del'(d) { H.poids = H.poids.filter(p => p.id !== d.v); saveH(); enqueue('deletePoids', { id: d.v }); render(); },
  stop() { modal = { type: 'stop' }; render(); },
  'cancel-ask'(d) { modal = { type: 'cancel', i: +d.v }; render(); },
  'cancel-ok'() { const s = plan()[modal.i]; cancelSession(modal.i); modal = null; sub = null; view = 'today'; navOpen = false; toast('Séance annulée', `${P.seances[s.seance].nom} est de nouveau à faire.`); render(); },
  'stop-ok'() { modal = null; if (A.items.some(it => it.sets.length)) finishSession(); else closeSession(); },
  close() { closeSession(); },
  /* Chronos */
  tool(d) { T.mode = d.v; T.segs = []; T.idx = 0; render(); },
  'tool-exit'() { T.running = false; T.paused = null; T.sw.running = false; T.mode = null; render(); },
  tcfg(d) {
    const min = { work: 5, rest: 0, rounds: 1, min: 1, sec: 15 }[d.f];
    tool[d.k][d.f] = Math.max(min, tool[d.k][d.f] + (+d.v)); LS.set('toolcfg', tool); render();
  },
  'tool-go'() {
    let segs = [{ label: 'Prêt', dur: 10 }];
    if (T.mode === 'tabata') { const c = tool.tabata; for (let r = 1; r <= c.rounds; r++) { segs.push({ label: 'Effort', dur: c.work, round: r, of: c.rounds }); if (r < c.rounds && c.rest) segs.push({ label: 'Repos', dur: c.rest, round: r, of: c.rounds }); } }
    else if (T.mode === 'emom') { for (let m = 1; m <= tool.emom.min; m++) segs.push({ label: 'Minute', dur: 60, round: m, of: tool.emom.min }); }
    else segs = [{ label: 'Minuteur', dur: tool.minuteur.sec }];
    startTool(segs);
  },
  'tool-pause'() {
    if (T.paused) { T.end = Date.now() + T.paused * 1000; T.paused = null; T.running = true; }
    else { T.paused = (T.end - Date.now()) / 1000; T.running = false; }
    render();
  },
  'tool-stop'() { T.running = false; T.paused = null; T.segs = []; render(); },
  sw() { unlockAudio(); if (T.sw.running) { T.sw.acc += Date.now() - T.sw.start; T.sw.running = false; } else { T.sw.start = Date.now(); T.sw.running = true; requestWake(); } render(); },
  'sw-reset'() { T.sw = { start: 0, acc: 0, running: false }; render(); },
  /* Réglages */
  async 'cfg-save'() {
    cfg = { url: document.getElementById('c-url').value.trim(), token: document.getElementById('c-tok').value };
    LS.set('cfg', cfg);
    try { await api('ping'); net = { ok: true, msg: '', tested: true }; toast('Connecté', 'L’app enregistre dans votre Google Sheet.'); await refresh(); }
    catch (e) { net = { ok: false, msg: e.message }; }
    render();
  },
  async 'prog-import'() {
    const f = document.getElementById('p-file').files[0];
    if (!f) { toast('Aucun fichier', 'Choisissez d’abord programme.json.'); return; }
    let pj; try { pj = JSON.parse(await f.text()); if (!pj.semaines || !pj.seances || !pj.exercices) throw 0; } catch { toast('Fichier refusé', 'Ce n’est pas un programme valide.'); return; }
    try { await api('setProgramme', { json: JSON.stringify(pj) }); P = pj; LS.set('programme', P); seqCache = null; toast('Programme chargé', pj.meta.titre); render(); }
    catch (e) { toast('Chargement impossible', e.message); }
  },
  manual() {
    const date = document.getElementById('m-date').value, id = document.getElementById('m-ex').value;
    const kg = parseFloat(document.getElementById('m-kg').value), reps = parseInt(document.getElementById('m-reps').value, 10);
    if (!date || !id || isNaN(kg) || isNaN(reps)) { toast('Série incomplète', 'Renseignez la date, la charge et les reps.'); return; }
    const wk = Math.max(1, P.semaines.filter(x => x.debut <= date).length);
    const w = P.semaines[wk - 1];
    const prev = H.series.filter(r => r.exercice_id === id && r.date === date && r.type === 'normale').length;
    const r = { id: uid(), horodatage: Date.now(), date, index_seance: null, semaine: wk, phase: w.phase, seance: '', ordre: null, exercice_id: id, exercice_prevu_id: id,
      numero_serie: prev + 1, type: 'normale', serie_parent_id: '', charge_kg: kg, reps, duree_s: null, rpe: null, reps_min: null, reps_max: null, decharge: !!w.decharge };
    H.series.push(r); saveH(); enqueue('addSerie', r);
    toast('Série ajoutée', `${EX(id).nom} : ${fmtNum(kg)} kg × ${reps}`);
    document.getElementById('m-kg').value = ''; document.getElementById('m-reps').value = '';
  },
  async sync() { await flush(); await refresh(); toast('Rechargé', 'Les données du Sheet sont à jour dans l’app.'); },
  'reset-ask'() { modal = { type: 'reset' }; render(); },
  async 'reset-ok'() {
    try {
      await api('reset');
      H = { series: [], seances: [], modifications: [], poids: H.poids || [], notes: H.notes || [] }; saveH();
      Q = []; LS.set('queue', Q); A = null; saveA(); missedDismissed = false;
      modal = null; toast('Données effacées', 'Vous repartez de zéro.'); render();
    } catch (e) {
      modal = null; render();
      toast('Effacement impossible', e.message.includes('inconnue') ? 'Le script Google n’est pas à jour : collez la nouvelle version de Code.gs et redéployez.' : e.message);
    }
  },
  update() { location.replace(location.pathname + '?v=' + Date.now()); }
};
$app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const f = ACT[b.dataset.a]; if (f) f(b.dataset, b, ev);
});
$app.addEventListener('input', ev => {
  if (ev.target.id === 'rpe' && A && A.draft) {
    A.draft.rpe = +ev.target.value; saveA();
    const l = document.getElementById('rpev'); if (l) l.textContent = fmtNum(A.draft.rpe);
  }
});

/* ---------- Version et cycle de vie ---------- */
async function checkVersion() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const v = String((await r.json()).version);
    if (v !== APP_VERSION && sessionStorage.getItem('lb_reloaded') !== v) {
      sessionStorage.setItem('lb_reloaded', v);
      location.replace(location.pathname + '?v=' + v);
    }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    tick(); flush(); checkVersion();
    if ((A && A.step !== 'done') || T.running || T.sw.running) requestWake();
  }
});
// Supprime tout ancien service worker (ancienne version de l'app dans le même dépôt)
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if ('caches' in window) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});

if (A && A.step !== 'done') requestWake();
render();
checkVersion();
refresh();
flush();
</script>
